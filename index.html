<style>


body{
    margin:20px;
    background:#1e1e1e;

h1{

.subtitle{

.logo-wrapper{

.logo{

    border-radius:50%;

    outline:3px solid white;
    outline-offset:3px;
}

.new-sound-btn{
    position:center;
    /*left:-200px;
    top:50%;
    transform:translateY(-50%);*/
    background:#B57EDC;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    font-size:16px;
}

.new-sound-btn:hover{
    background:#800080;
}

#resetAllBtn{
    position:absolute;
    background:#d00000;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    

}
#resetAllBtn:hover{
    background:#800080;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:15px;
    width:min(700px,100%);
    margin:auto;
}

.sound-container{
    display:flex;
    flex-direction:column;
}

.sound-btn{
    position:relative;
    width:100%;
    height:100px;
    border:none;
    border-radius:10px;
    background:#B57EDC;
    color:white;
    font-size:22px;
    cursor:pointer;
    overflow:hidden;
}

.sound-btn:hover{
    background:#800080;
}

.sound-btn.playing{
    background:#18b84a;
}

.sound-btn.playing::before{
    content:"STOP";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:28px;
    background:#d00000;
    color:white;
    font-weight:bold;
    line-height:28px;
    opacity:0;
    transition:.2s;
    z-index:10;
}

.sound-btn.playing:hover::before{
    opacity:1;
}


.sound-btn video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:black;
    pointer-events: none;
}
.file-label{
    font-size:12px;

}

<body>

<h1>
   <div class="title-block">

    <h1>
        🎵 Soundboard Théâtre    </h1>
  
 <div style="display: flex; align-items: center; gap:30px;">
            <span class="subtitle">Souffler n'est pas jouer</span>
<button id="appVersion"></button>
</div>  
        


    
</div>  

</h1>

<div class="logo-wrapper">
<div style="display: flex; align-items: center; gap:10px; margin-top 15px">
    <button id="newSoundBtn" class="new-sound-btn">
        ➕  Nouveau Son
    </button>

<button id="resetAllBtn">
    🗑 Reset
</button>
</div>
</div>
    <img
        src="logo theatre boulogne.jpg"

</div>


<input
    type="file"
    id="filePicker"
    accept=".mp3,.wav,.ogg,.m4a,.mp4"
    hidden>

<div class="grid" id="grid"></div>

<div id="menuOverlay" class="menu-overlay">
    <div class="menu-box">
        <button id="chooseBtn">🎵 Choisir un média</button>
        <button id="renameBtn">✏️ Renommer</button>
        <button id="resetBtn">🗑 Réinitialiser</button>
	<button id="deleteBtn">❌ Supprimer le bouton</button>
        <button onclick="closeMenu()">Fermer</button>
    </div>
</div>



<script>
const APP_VERSION = "1.2.2";
const APP_BUILD = "31/10/2026";
const APP_AUTHOR = "Didier LOISEAU";

let db;

function showAbout() {

    document.getElementById(
        "aboutVersion"
    ).textContent =
        "Version : " + APP_VERSION;

    document.getElementById(
        "aboutBuild"
    ).textContent =
        "Build : " + APP_BUILD;

    document.getElementById(
        "aboutAuthor"
    ).textContent =
        "Auteur : " + APP_AUTHOR;

    document.getElementById(
        "aboutModal"
    ).style.display = "flex";
}

function closeAbout() {

    document.getElementById(
        "aboutModal"
    ).style.display = "none";
}


document.addEventListener(
    "DOMContentLoaded",
    () => {

        const versionBox =
            document.getElementById(
                "appVersion"
            );

        if (versionBox) {

            versionBox.textContent =
    `Version ${APP_VERSION}`;

            versionBox.onclick =
                showAbout;
        }

        document
            .getElementById(
                "closeAboutBtn"
            )
            .addEventListener(
                "click",
                closeAbout
            );

        document.title =
            `🎵 Soundboard Théâtre v${APP_VERSION}`;
    }
);


const buttons = [];
let currentAudio = null;
let currentVideo = null;
let currentButtonIndex = null;
let currentButtonElement = null;
let selectedIndex = null;

async function openDatabase() {

    return new Promise((resolve, reject) => {

        const request = indexedDB.open(
            "SoundboardDB",
            1
        );

        request.onupgradeneeded = event => {

            db = event.target.result;

            if (!db.objectStoreNames.contains("sounds")) {

                db.createObjectStore(
                    "sounds",
                    { keyPath: "id" }
                );
            }
        };

        request.onsuccess = event => {

            db = event.target.result;
            resolve(db);
        };

request.onerror = event => {
    console.error(
        "Erreur ouverture IndexedDB",
        event
    );
    reject(event);
};
    });
}


async function saveSound(
    index,
    file,
    label
) {

    if (!file) return;

    const tx =
        db.transaction(
            ["sounds"],
            "readwrite"
        );

    const store =
        tx.objectStore("sounds");

    store.put({
        id: index,
        label: label || file.name,
        fileName: file.name,
        type: file.type || "",
        blob: file
    });
}

function saveConfig() {

    try {

        localStorage.setItem(
            "soundboardConfig",
            JSON.stringify(sounds)
        );

    } catch (err) {

        console.error(
            "Erreur sauvegarde configuration",
            err
        );
    }
}

async function loadSound(index) {

    return new Promise(resolve => {

        try {

            const tx =
                db.transaction(
                    ["sounds"],
                    "readonly"
                );

            const store =
                tx.objectStore("sounds");

            const req =
                store.get(index);

            req.onsuccess = () => {
                resolve(req.result || null);
            };

            req.onerror = () => {

                console.error(
                    "Erreur lecture son",
                    index
                );

                resolve(null);
            };

        } catch (err) {

            console.error(
                "Erreur IndexedDB",
                err
            );

            resolve(null);
        }

    });
}
async function loadAllSounds() {

    const tx =
        db.transaction(
            ["sounds"],
            "readonly"
        );

    const store =
        tx.objectStore("sounds");

    const request =
        store.getAll();

    request.onsuccess = () => {

        sounds = {};

        request.result.forEach(sound => {

            try {

                if (!sound) return;

                if (!sound.blob) {
                    console.warn(
                        "Blob manquant pour",
                        sound.id
                    );
                    return;
                }

                const url =
                    URL.createObjectURL(
                        sound.blob
                    );

                sounds[sound.id] = {

                    label:
                        sound.label ||
                        `Son ${sound.id}`,

                    fileName:
                        sound.fileName ||
                        "Fichier inconnu",

                    type:
                        sound.type &&
                        sound.type.startsWith(
                            "video"
                        )
                            ? "video"
                            : "audio",

                    url
                };

            } catch (err) {

                console.error(
                    "Erreur chargement son",
                    sound?.id,
                    err
                );

            }

        });

        saveConfig();

        rebuildButtons();
    };

    request.onerror = err => {

        console.error(
            "Erreur lecture IndexedDB",
            err
        );

        sounds = {};

        rebuildButtons();
    };
}


   

document
.getElementById("resetAllBtn")
.addEventListener("click",async ()=>{

    if(!confirm(
        "Supprimer tous les sons ?"
    )){
        return;
    }

    const tx =
        db.transaction(
            ["sounds"],
            "readwrite"
        );

    tx.objectStore("sounds")
      .clear();

    stopCurrent();

    sounds = {};

    while(buttons.length > 1){

        const btn =
            buttons.pop();

        btn.parentElement.remove();
    }

    updateButton(0);

localStorage.removeItem("soundboardConfig");
});


const grid = document.getElementById("grid");

let sounds = {};

try {
    sounds = JSON.parse(
        localStorage.getItem("soundboardConfig") || "{}"
    );
} catch (e) {
    console.error(
        "Configuration corrompue",
        e
    );

    localStorage.removeItem(
        "soundboardConfig"
    );

    sounds = {};
}
function updateButton(index){

    const btn=buttons[index];

    if(!btn) return;

    const sound=sounds[index];

    btn.textContent =
        sound?.label || `Son ${index}`;

    btn.parentElement.querySelector(".file-label").textContent =
        sound?.fileName || "Aucun fichier";
}

function stopCurrent(){

    if(currentAudio){
        currentAudio.pause();
        currentAudio.currentTime=0;
    }

    if(currentVideo){
        currentVideo.pause();
        currentVideo.remove();
    }

    currentButtonElement?.classList.remove("playing");

    const old=currentButtonIndex;

    currentAudio=null;
    currentVideo=null;
    currentButtonIndex=null;
    currentButtonElement=null;

    if(old!==null){
        updateButton(old);
    }
}

function play(index,button){

    const sound=sounds[index];

    if(!sound) return;

    if(currentButtonIndex===index){
        stopCurrent();
        return;
    }

    stopCurrent();

    if(sound.type==="video"){

        const video=document.createElement("video");

        video.src=sound.url;
        video.controls=true;
       video.autoplay = true;

video.onended = () => {
    stopCurrent();
};
        button.textContent="";
        button.appendChild(video);

        button.classList.add("playing");

        currentVideo=video;
        currentButtonIndex=index;
        currentButtonElement=button;

        return;
    }

    const audio=new Audio(sound.url);

    currentAudio=audio;
    currentButtonIndex=index;
    currentButtonElement=button;

    button.classList.add("playing");

    audio.onended=stopCurrent;
audio.play()
.catch(err => {
    console.error(err);
});
}

function createButton(index){

    const container=document.createElement("div");

    container.className="sound-container";

    const button=document.createElement("button");

    button.className="sound-btn";

   let timer;
let longPress = false;

button.addEventListener("pointerdown", () => {
    longPress = false;

    timer = setTimeout(() => {
        longPress = true;
        selectedIndex = index;
        showMenu();
    }, 700);
});

button.addEventListener("pointerup", (e) => {
    clearTimeout(timer);

    if (longPress) {
        e.preventDefault();
        return;
    }

    play(index, button);
});

button.addEventListener("pointerleave", () => {
    clearTimeout(timer);
});

button.addEventListener("pointercancel", () => {
    clearTimeout(timer);
});

   
    button.addEventListener(
        "contextmenu",
        e=>{
            e.preventDefault();
            selectedIndex=index;
            showMenu();
        }
    );

    const label=document.createElement("div");

    label.className="file-label";

    container.append(button,label);

    grid.appendChild(container);

    buttons[index]=button;

    updateButton(index);
}

function ensureButtonExists(index){

    while(buttons.length<=index){
        createButton(buttons.length);
    }
}

function rebuildButtons()
{
    console.log("Reconstruction des boutons");

    grid.innerHTML = "";
    buttons.length = 0;

    const keys = Object.keys(sounds).map(Number);

    const count = Math.max(
        1,
        keys.length
            ? Math.max(...keys) + 1
            : 0
    );

    for (let i = 0; i < count; i++) {
        createButton(i);
    }
}
function showMenu() {

    const deleteBtn =
        document.getElementById("deleteBtn");

    // Le bouton 0 ne peut jamais être supprimé
    if (selectedIndex === 0) {
        deleteBtn.style.display = "none";
    } else {
        deleteBtn.style.display = "block";
    }

    document
        .getElementById("menuOverlay")
        .style.display = "flex";
}function closeMenu(){
    document.getElementById("menuOverlay").style.display="none";
}

document.getElementById("newSoundBtn")
.addEventListener("click",()=>{
    ensureButtonExists(buttons.length);
});

document
.getElementById("chooseBtn")
.onclick = () => {

    closeMenu();

    const picker =
        document.getElementById("filePicker");

    picker.value = "";

    picker.removeAttribute("capture");
capture="camera"


    picker.accept =
        ".mp3,.wav,.ogg,.m4a,.mp4";

    picker.onchange = e => {

        const file =
            e.target.files[0];

        if (!file) return;

        const allowedExtensions = [
            ".mp3",
            ".wav",
            ".ogg",
            ".m4a",
            ".mp4"
        ];

        const allowedMimeTypes = [
            "",
            "audio/mpeg",
            "audio/mp3",
            "audio/wav",
            "audio/x-wav",
            "audio/wave",
            "audio/vnd.wave",
            "audio/ogg",
            "audio/mp4",
            "audio/x-m4a",
            "video/mp4"
        ];
const forbiddenExtensions = [
    ".exe",
    ".bat",
    ".cmd",
    ".msi",
    ".apk",
    ".zip",
    ".rar",
    ".7z",
    ".pdf",
    ".doc",
    ".docx",
    ".xls",
    ".xlsx",
    ".ppt",
    ".pptx",
    ".txt",
    ".html",
    ".htm",
    ".js",
    ".php"
];
        const lowerName =
            file.name.toLowerCase();

const forbiddenFile =
    forbiddenExtensions.some(ext =>
        lowerName.endsWith(ext)
    );

if (forbiddenFile) {

    alert(
        "Ce type de fichier n'est pas autorisé."
    );

    picker.value = "";

    return;
}
        const extensionValid =
            allowedExtensions.some(ext =>
                lowerName.endsWith(ext)
            );

      const mimeValid =
    file.type === "" ||
    file.type.startsWith("audio/") ||
    file.type === "video/mp4";


        if (!extensionValid) {

            alert(
                "Extension non autorisée.\n\n" +
                "Formats acceptés :\n" +
                "• MP3\n" +
                "• WAV\n" +
                "• OGG\n" +
                "• M4A\n" +
                "• MP4"
            );

            picker.value = "";
            return;
        }

        if (!mimeValid) {

            alert(
                "Type de fichier non pris en charge.\n\n" +
                "Type détecté : " +
                (file.type || "inconnu")
            );

            picker.value = "";
            return;
        }

        sounds[selectedIndex] = {
            fileName: file.name,

            label:
                sounds[selectedIndex]?.label ||
                file.name,

            type:
                file.type.startsWith("video/")
                    ? "video"
                    : "audio",

            url: URL.createObjectURL(file)
        };

        saveSound(
            selectedIndex,
            file,
            sounds[selectedIndex].label
        );

        updateButton(selectedIndex);

        saveConfig();
    };
    picker.click();
};


document
.getElementById("renameBtn")
.onclick = () => {

    closeMenu();

    if (!sounds[selectedIndex]) {

        alert(
            "Veuillez d'abord choisir un fichier audio ou vidéo avant de renommer ce bouton."
        );

        return;
    }

    const label = prompt(
        "Nouveau libellé",
        sounds[selectedIndex]?.label || ""
    );

    if (!label) return;

    sounds[selectedIndex].label = label;

    loadSound(selectedIndex)
    .then(sound => {

        if (sound) {

            saveSound(
                selectedIndex,
                sound.blob,
                label
            );
        }

        updateButton(selectedIndex);

        saveConfig();
    })
    .catch(err => {

        console.error(
            "Erreur renommage",
            err
        );

        updateButton(selectedIndex);

        saveConfig();
    });
};
document
.getElementById("resetBtn")
.onclick = () => {

    closeMenu();

    const tx =
        db.transaction(
            ["sounds"],
            "readwrite"
        );

    tx.objectStore("sounds")
      .delete(selectedIndex);

    if (sounds[selectedIndex]?.url) {

        URL.revokeObjectURL(
            sounds[selectedIndex].url
        );

    }

    delete sounds[selectedIndex];

    updateButton(selectedIndex);

    saveConfig();
};
document
.getElementById("deleteBtn")
.onclick = async () => {

    closeMenu();

    if (selectedIndex === 0) {

        alert(
            "Le bouton 0 ne peut pas être supprimé."
        );

        return;
    }

    if (
        !confirm(
            "Supprimer ce bouton ?"
        )
    ) {
        return;
    }

    stopCurrent();

    const keys =
        Object.keys(sounds)
        .map(Number)
        .sort((a,b)=>a-b);

    const records = {};

    for (const key of keys) {

        records[key] =
            await loadSound(key);

    }

    const tx =
        db.transaction(
            ["sounds"],
            "readwrite"
        );

    const store =
        tx.objectStore("sounds");

    await new Promise(resolve => {

        const req =
            store.clear();

        req.onsuccess = resolve;
        req.onerror = resolve;

    });

    const newSounds = {};

    for (const key of keys) {

        if (key < selectedIndex) {

            newSounds[key] =
                sounds[key];

            if (records[key]) {

                store.put({
                    id: key,
                    label:
                        records[key].label,
                    fileName:
                        records[key].fileName,
                    type:
                        records[key].type,
                    blob:
                        records[key].blob
                });

            }

        } else if (
            key > selectedIndex
        ) {

            newSounds[key - 1] =
                sounds[key];

            if (records[key]) {

                store.put({
                    id: key - 1,
                    label:
                        records[key].label,
                    fileName:
                        records[key].fileName,
                    type:
                        records[key].type,
                    blob:
                        records[key].blob
                });

            }
        }
    }

    sounds = newSounds;

    saveConfig();

    rebuildButtons();
};async function init() {

    await openDatabase();

    await loadAllSounds();
}

init();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/Soundboard-theatre/service-worker.js');
}        



</script>
